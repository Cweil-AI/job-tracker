# PostgreSQL connection string — set as DATABASE_URL env var in Railway
database_url: ""


campaigns:

  # ---------------------------------------------------------------------------
  # Customer Success Operations
  # ---------------------------------------------------------------------------
  Customer Success Operations:
    queries:
      - "Director Customer Success Operations"
      - "Customer Success Operations Manager"
      - "Customer Success Operations Director"
      - "Senior Manager Customer Success Operations"
      - "Head of Customer Success Operations"
      - "Customer Operations Manager"
      - "Customer Operations Director"
      - "CS Operations Manager"
      - "Customer Success Strategy Operations"
      - "Customer Success Operations Lead"

    filters:
      # Job title MUST contain at least one of these words (case-insensitive)
      title_must_include:
        - customer success
        - customer operations
        - cs operations
        - csops

      # Job title must NOT contain any of these words
      title_must_exclude:
        - software engineer
        - software developer
        - data scientist
        - data analyst
        - business analyst
        - marketing
        - designer
        - sales representative
        - account executive
        - nurse
        - driver
        - recruiter
        - product manager
        - project manager

      # Remote US-wide + Greater Boston Area hybrid
      location_allow:
        - remote
        - united states
        - massachusetts
        - boston
        - cambridge
        - waltham
        - woburn
        - burlington
        - lexington
        - newton
        - natick
        - framingham
        - " ma"


