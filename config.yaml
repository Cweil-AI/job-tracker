# =============================================================================
# Job Tracker Configuration — John Melone
# =============================================================================

# PostgreSQL connection string — set as DATABASE_URL env var in Railway
database_url: ""


# =============================================================================
# Candidate profile — used for AI job scoring and email digests
# =============================================================================
candidate:
  name: John Melone
  role: IT Staffing / Technical Recruiting leader
  summary: >
    IT staffing and technical recruiting leader with 15+ years of full-lifecycle
    recruiting across startups, high-growth companies, and enterprises. Currently
    Director of IT Staffing at Abacus Group, where he built a technology recruiting
    division from the ground up ($0 to $57.5K/month gross profit). Deep experience
    placing engineers (full stack, AI/ML, QA, DevOps), technical PMs, and building
    and mentoring recruiting teams. Skilled in Boolean/X-ray sourcing, LinkedIn
    Recruiter, ATS platforms (Greenhouse, Lever, Workday, Bullhorn), and AI-powered
    recruiting automation with Claude. Targeting in-house / corporate Technical
    Recruiter, Recruiting Manager, and Technical Account Manager roles (prefers
    internal roles over agency). Remote or hybrid in South Florida
    (Fort Lauderdale, Miami, Orlando).


campaigns:

  # ---------------------------------------------------------------------------
  # Technical Recruiting / Talent Acquisition (in-house focus)
  # ---------------------------------------------------------------------------
  Technical Recruiting:
    queries:
      - "technical recruiter"
      - "senior technical recruiter"
      - "recruiting manager"
      - "talent acquisition manager"
      - "technical sourcer"
      - "talent acquisition partner"
      - "technical account manager"
      - "recruiting lead"
      - "head of talent"
      - "talent acquisition specialist"

    filters:
      # Job title MUST contain at least one of these words (case-insensitive)
      title_must_include:
        - recruiter
        - recruiting
        - talent acquisition
        - sourcer
        - sourcing
        - staffing
        - talent partner
        - head of talent
        - technical account manager

      # Job title must NOT contain any of these words
      title_must_exclude:
        - software engineer
        - software developer
        - product manager
        - project manager
        - data scientist
        - data analyst
        - business analyst
        - marketing
        - designer
        - accountant
        - nurse
        - driver
        - sales representative

      # Remote US-wide + South Florida (Fort Lauderdale, Miami, Orlando)
      location_allow:
        - remote
        - united states
        - usa
        - u.s.
        - worldwide
        - anywhere
        - global
        - north america
        - americas
        - florida
        - fort lauderdale
        - ft lauderdale
        - miami
        - orlando
        - boca raton
        - west palm beach
        - fort myers
        - tampa
        - " fl"


