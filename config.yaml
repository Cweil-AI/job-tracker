# PostgreSQL connection string — set as DATABASE_URL env var in Railway
database_url: ""


# =============================================================================
# Candidate profile — used for AI job scoring and email digests
# =============================================================================
candidate:
  name: Elena Kritskaya
  role: Operations leader and AI-native operator
  summary: >
    High-agency operations professional with 10+ years designing processes,
    tools, and systems across operations, program management, vendor management,
    and executive support. At Treasury Wine Estates centralized a ~$2M rebate
    program portfolio (350+ programs/year), cut approval volume 40%, payment
    cycle time ~80%, and reporting turnaround 8x. Fluent in AI-native development:
    Claude Code, LLM APIs, multi-agent systems, Slack apps, MCP integrations,
    Supabase/PostgreSQL, and serverless deployment. Targeting Senior Operations
    Associate, Product Operations, AI Operations, and Founding/Founder's Associate
    roles. Based in San Francisco; open to remote and SF Bay Area.


campaigns:

  # ---------------------------------------------------------------------------
  # Operations / Product Ops / AI Ops / Founder's Associate
  # ---------------------------------------------------------------------------
  Operations & AI Ops:
    queries:
      - "operations associate"
      - "senior operations associate"
      - "business operations"
      - "product operations"
      - "AI operations"
      - "AI ops"
      - "founder associate"
      - "founders associate"
      - "chief of staff"
      - "operations manager"

    filters:
      # Job title MUST contain at least one of these words (case-insensitive)
      title_must_include:
        - operations
        - operating
        - product ops
        - ai ops
        - founder
        - founding
        - chief of staff

      # Job title must NOT contain any of these words
      title_must_exclude:
        - software engineer
        - software developer
        - devops
        - it operations
        - network operations
        - security operations
        - warehouse
        - field operations
        - store operations
        - retail operations
        - restaurant operations
        - manufacturing operations
        - nurse
        - driver
        - technician
        - mechanic
        - designer
        - recruiter
        - account executive
        - sales representative

      # Remote US-wide + San Francisco Bay Area
      location_allow:
        - remote
        - united states
        - usa
        - u.s.
        - worldwide
        - anywhere
        - global
        - north america
        - americas
        - california
        - san francisco
        - bay area
        - oakland
        - berkeley
        - palo alto
        - mountain view
        - menlo park
        - san jose
        - san mateo
        - redwood city
        - sunnyvale
        - santa clara
        - " ca"


